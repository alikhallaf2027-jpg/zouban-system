<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZOBAN V7 Royal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');
body{background:#0a142e;color:#fff;font-family:'Cairo',sans-serif;margin:0;padding:12px;text-align:center}
.card{max-width:780px;margin:auto;background:#121f44;border:2px solid #f3d24a;border-radius:20px;padding:16px}
h1{color:#f3d24a;font-size:22px}
textarea{width:100%;height:90px;background:#000a20;color:#f3d24a;border:2px solid #f3d24a;border-radius:12px;font-size:22px;text-align:center;direction:ltr;padding:10px}
.eyes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0}
.eye{background:#0a1633;border:1px solid #c9a227;border-radius:12px;padding:10px}
.eye div{font-size:12px;color:#f3d24a}
.eye b{display:block;font-size:24px;margin-top:4px}
.eye input{width:100%;margin-top:6px;background:#000;color:#fff;border:1px solid #334b7a;border-radius:8px;text-align:center;font-size:20px;font-weight:900;padding:6px}
.lvl{background:#0d1a36;border-radius:14px;padding:10px;margin-top:12px;border:1px solid #2a3f6a}
button{background:#f3d24a;border:none;border-radius:10px;padding:10px 16px;font-weight:900;margin:4px;cursor:pointer;font-family:'Cairo'}
</style>
</head>
<body>
<div class="card">
<h1>ZOBAN V7 👑 الست عيون - ليفل 1 و 2</h1>
<textarea id="big">1</textarea>
<div style="margin:8px">
<button onclick="addZ(1000)">+1,000 صفر</button>
<button onclick="addZ(100000)">+100 ألف صفر</button>
<button onclick="doHouse()">🔥 سكن</button>
<button onclick="clearAll()" style="background:#1a2d5a;color:#f3d24a;border:1px solid #f3d24a">مسح</button>
</div>

<div class="lvl">
<h3 style="color:#f3d24a;margin:4px">⚡ ليفل 1 - الأساسي</h3>
<div class="eyes">
<div class="eye"><div>👁️ خرطوش</div><input id="c1" readonly><small>max 999</small></div>
<div class="eye"><div>🌙 هلال</div><input id="c2" readonly><small>max 999</small></div>
<div class="eye"><div>🔺 هرم</div><input id="c3" readonly><small>max 999</small></div>
<div class="eye"><div>📐 ضلع</div><input id="c4" value="20!" readonly><small>ثابت 6</small></div>
<div class="eye"><div>🧱 بلوك</div><input id="c5" readonly><small>max 99</small></div>
<div class="eye"><div>🪶 ريشة</div><input id="c6" readonly><small>خانات→بلوك</small></div>
</div>
</div>

<div class="lvl" id="lvl2" style="display:none;border-color:#f3d24a">
<h3 style="color:#f3d24a;margin:4px">👑 ليفل 2 - الخرافي (مليار+)</h3>
<div class="eyes">
<div class="eye"><div>👁️ خرطوش 2</div><input id="c1_2" readonly></div>
<div class="eye"><div>🌙 هلال 2</div><input id="c2_2" readonly></div>
<div class="eye"><div>🔺 هرم 2</div><input id="c3_2" readonly></div>
<div class="eye"><div>📐 ضلع 2</div><input id="c4_2" value="20!" readonly></div>
<div class="eye"><div>🧱 بلوك 2</div><input id="c5_2" readonly></div>
<div class="eye"><div>🪶 ريشة 2</div><input id="c6_2" readonly></div>
</div>
</div>

<div id="msg" style="margin-top:10px;color:#f3d24a;font-size:13px">✓ جاهز</div>
</div>
<script>
const big=document.getElementById('big');
function clean(s){return s.replace(/[^0-9]/g,'')||'0'}
function addZ(n){big.value=(clean(big.value)||'1')+'0'.repeat(n);doHouse()}
function clearAll(){big.value='1';doHouse()}
function doHouse(){
let s=clean(big.value);let L=s.length;let q=Math.floor((L-1)/18);let blk=(L-1)%18;
document.getElementById('c1').value=q%1000;
document.getElementById('c2').value=Math.floor(q/1000)%1000;
document.getElementById('c3').value=Math.floor(q/1000000)%1000;
document.getElementById('c5').value=blk;
document.getElementById('c6').value=L+'→'+q;
let q2=Math.floor(q/1000000000);
if(q>=1000000000){
document.getElementById('lvl2').style.display='block';
document.getElementById('c1_2').value=q2%1000;
document.getElementById('c2_2').value=Math.floor(q2/1000)%1000;
document.getElementById('c3_2').value=Math.floor(q2/1000000)%1000;
document.getElementById('c5_2').value=blk;
document.getElementById('c6_2').value=q;
document.getElementById('msg').innerHTML='👑 ليفل 2 اشتغل! '+L.toLocaleString()+' خانة';
}else{
document.getElementById('lvl2').style.display='none';
document.getElementById('msg').innerHTML='✓ تسكن ليفل 1 | '+L.toLocaleString()+' خانة = '+q.toLocaleString()+' بلوك';
}
}
big.addEventListener('input',doHouse);doHouse();
</script>
</body>
</html>
