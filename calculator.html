<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZOOBAN CALCULATOR</title>
<style>
body{background:#111;color:#fff;font-family:Arial;text-align:center;padding:20px}
h1{color:#FFD700;font-size:32px;margin:10px}
input{width:90%;padding:15px;font-size:22px;border:3px solid #FFD700;border-radius:10px;background:#222;color:#fff;text-align:center}
button{width:92%;padding:15px;margin-top:15px;font-size:22px;background:#FFD700;color:#000;border:none;border-radius:10px;font-weight:bold}
#out{margin-top:20px;text-align:right;background:#222;padding:15px;border-radius:10px;border:1px solid #FFD700}
.unit{padding:10px;border-bottom:1px solid #333}
.unit b{color:#FFD700}
</style>
</head>
<body>
<h1>𓂀 ZOOBAN CALCULATOR</h1>
<p style="color:#FFD700">BY: ALI RAGAB ALI KHELAF - 20! SYSTEM %100 - توكلنا على الله</p>

<input id="num" type="number" placeholder="اكتب الرقم هنا مثلا 1000 او 2432902008176640000">
<button onclick="calc()">ENTER - سكن الرقم</button>

<div id="out"></div>

<p style="margin-top:20px;color:#FFD700">ZOOBAN MOZON 100%<br>R=D/1000 | B=2e18 | H=Dx6 | HL=H*1000 | KH=HL*1000</p>

<script>
function calc(){
 let D = BigInt(document.getElementById('num').value || 0);
 if(D==0){alert('اكتب رقم يا ملك');return;}
 let units = [
  {n:'ريشة - Risha', v:1n},
  {n:'ضلع - Del3', v:1000n},
  {n:'بلوك - Block', v:2000000000000000000n},
  {n:'هرم - Haram', v:2000000000000000000n*6n},
  {n:'هلال - Hilal', v:2000000000000000000n*6n*1000n},
  {n:'خرطوش - Khartoush', v:2000000000000000000n*6n*1000n*1000n}
 ];
 let h='';
 units.forEach(u=>{
   let count = D / u.v;
   let rem = D % u.v;
   h+=`<div class="unit"><b>${u.n}:</b> ${count.toLocaleString('en-US')} <br><span style="font-size:12px;color:#aaa">الباقي: ${rem.toLocaleString('en-US')} - الوحدة: ${u.v.toLocaleString('en-US')}</span></div>`;
 });
 document.getElementById('out').innerHTML=h;
}
</script>
</body>
</html>
