<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة ذوبان</title>
<style>
body{background:#0f172a;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#1e293b;padding:20px;border-radius:15px;width:90%;max-width:350px;box-shadow:0 0 20px #000}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;box-sizing:border-box;font-size:16px}
button{width:100%;padding:12px;background:#3b82f6;color:#fff;border:none;border-radius:8px;font-size:18px;margin-top:10px;font-weight:bold}
#res{margin-top:15px;background:#0f172a;padding:15px;border-radius:8px;text-align:center;font-size:20px;color:#22c55e}
h3{text-align:center;color:#38bdf8}
</style>
</head>
<body>
<div class="card">
<h3>حاسبة ذوبان</h3>
<input id="n" type="number" value="5" placeholder="عدد n">
<input id="q" type="number" value="3" placeholder="كمية q">
<input id="p" type="number" placeholder="السعر">
<button onclick="calc()">احسب الآن</button>
<div id="res">النتيجة ستظهر هنا</div>
</div>
<script>
function calc(){
let n=parseFloat(document.getElementById('n').value)||0;
let q=parseFloat(document.getElementById('q').value)||0;
let p=parseFloat(document.getElementById('p').value)||0;
let result = (n * q);
if(p>0) result = result * p;
document.getElementById('res').innerText = 'الناتج: ' + result;
}
</script>
</body>
</html>
