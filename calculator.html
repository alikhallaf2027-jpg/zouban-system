<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة زوبان</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;background:#f3f4f6;padding:15px}
.card{max-width:480px;margin:auto;background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.1);overflow:hidden}
.header{background:#0f172a;color:#fff;padding:20px;text-align:center}
.header h2{margin:0}
.content{padding:20px}
label{display:block;margin:12px 0 5px;font-weight:700}
input,select{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;font-size:16px}
button{width:100%;margin-top:20px;background:#2563eb;color:#fff;border:none;padding:14px;border-radius:12px;font-size:18px;font-weight:700}
#result{margin-top:20px;background:#f8fafc;border:2px dashed #ccc;border-radius:12px;padding:15px;display:none}
.res{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee}
</style>
</head>
<body>
<div class="card">
<div class="header"><h2>🧮 حاسبة زوبان للبلاط</h2><p>احسب بدقة</p></div>
<div class="content">
<label>طول الغرفة (متر)</label><input id="length" type="number" placeholder="4">
<label>عرض الغرفة (متر)</label><input id="width" type="number" placeholder="5">
<label>سعر المتر (ريال)</label><input id="price" type="number" placeholder="35">
<label>نسبة الهدر</label><select id="waste"><option value="5">5%</option><option value="10" selected>10% مستحسن</option><option value="15">15%</option></select>
<button onclick="calc()">احسب الآن</button>
<div id="result"></div>
</div>
</div>
<script>
function calc(){
let L=parseFloat(document.getElementById('length').value)||0;
let W=parseFloat(document.getElementById('width').value)||0;
let price=parseFloat(document.getElementById('price').value)||0;
let waste=parseFloat(document.getElementById('waste').value)||10;
if(L==0||W==0){alert('ادخل المقاسات');return;}
let area=L*W;
let total=area*(1+waste/100);
let totalPrice=total*price;
let r=document.getElementById('result');
r.style.display='block';
r.innerHTML=`<div class="res"><span>المساحة</span><span>${area.toFixed(2)} م²</span></div><div class="res"><span>مع الهدر ${waste}%</span><span>${total.toFixed(2)} م²</span></div>${price>0?`<div class="res"><b>التكلفة</b><b>${totalPrice.toFixed(2)} ريال</b></div>`:''}`;
}
</script>
</body>
</html>
