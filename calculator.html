<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة زوبان - النسخة العالمية</title>
<style>
*{box-sizing:border-box;font-family:Tajawal,sans-serif}
body{margin:0;background:#0f172a;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:15px}
.card{width:100%;max-width:500px;background:#fff;border-radius:20px;overflow:hidden}
.header{background:linear-gradient(135deg,#d4af37,#8a6d3b);padding:20px;text-align:center}
.header h2{margin:0;font-size:28px}
.content{padding:24px}
label{font-weight:bold;display:block;margin:14px 0 6px}
input,select{width:100%;padding:14px;border-radius:12px;border:2px solid #e5e7eb;font-size:16px}
button{width:100%;margin-top:20px;background:#0f172a;color:#d4af37;padding:16px;border:none;border-radius:12px;font-size:20px;font-weight:bold;cursor:pointer}
#result{margin-top:20px;background:#f3f4f6;padding:16px;border-radius:12px;text-align:center;font-size:22px;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<div class="header"><h2>𓋹 حاسبة زوبان الذكية</h2></div>
<div class="content">
<label>القيمة</label><input id="val" type="number" value="1">
<label>من</label><select id="from"><option>زوبان</option><option>ذراع</option><option>متر</option></select>
<label>إلى</label><select id="to"><option>متر</option><option>ذراع</option><option>زوبان</option></select>
<button onclick="calc()">احسب الآن</button>
<div id="result">النتيجة: --</div>
</div>
</div>
<script>
function calc(){
let v=parseFloat(document.getElementById('val').value);
let f=document.getElementById('from').value;
let t=document.getElementById('to').value;
let m=v; if(f==='زوبان') m=v*0.58; if(f==='ذراع') m=v*0.46;
let o=m; if(t==='زوبان') o=m/0.58; if(t==='ذراع') o=m/0.46;
document.getElementById('result').innerText='النتيجة: '+o.toFixed(4)+' '+t;
}
</script>
</body>
</html>
